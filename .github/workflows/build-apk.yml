name: Build Liquid Glass Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-Demo-v2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Liquid Glass Demo v2.0.0 (Optical Refraction & Dark Mode)"
          body: |
            ### 🌊 Liquid Glass Android Application Demo v2.0.0
            
            This release features a complete overhaul of the Liquid Glass design language, optical refraction physics, full Dark/Light theme switching, and fluid motion.
            
            #### ✨ Key Updates:
            - **Deep Optical Liquid Glass Refraction**: Multi-pass specular edge highlights, curved glass caustics, and animated liquid light shimmers.
            - **Full Dark & Light Mode**: Deep Obsidian Dark Mode (`#070B12` with glowing crystal glass) + Iridescent Frost Light Mode.
            - **Top & Bottom Scroll Fade Masks**: Smooth gradient blur transitions dissolving scrolling content seamlessly.
            - **Revamped Floating Navigation Dock**: High-contrast text readability, active glowing pill indicator, and glowing floating (+) action button.
            - **Rich Fluid Animations**: Kinetic spring overshoot, staggered entrance animations, and interactive touch ripples.
            - **Redesigned Workspace Canvas**: Live note creation, tag filters, completion toggles, and clean spacious layout.
            - **Zero Material 3 & Zero Emojis**: 100% custom vector icons and bespoke composables.
            
            #### 📲 Download APK:
            Download `app-debug.apk` below and install on any Android device running Android 8.0+ (API 26+).
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
