name: Build Liquid Glass Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-Demo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Liquid Glass Demo v1.0.0"
          body: |
            ### 🌊 Liquid Glass Android Application Demo v1.0.0
            
            This release contains the compiled APK for the modern liquid glass-inspired Android demo.
            
            #### Features:
            - **Liquid Glass Design System**: Frosted glass surfaces, specular borders, and fluid spring physics.
            - **Dynamic Animated Canvas**: Luminous refraction blobs with interactive Blue, Yellow, and Red accents.
            - **Circular 3-Line Menu**: Glass top bar triggering the sliding liquid drawer.
            - **Floating Central Nav Bar**: 3-option pill with responsive spring expansion on active tabs.
            - **Floating (+) Action Button**: Dedicated glowing button with Quick Creation modal.
            - **Zero Material 3 Look & Zero Emojis**: Custom vector icons and bespoke composables.
            
            #### Download APK:
            Download `app-debug.apk` below and install on any Android device running Android 8.0+ (API 26+).
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
